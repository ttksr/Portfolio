name: Leak guard

# Runs on every push: nothing private (keys, CTF flags, private files) may reach the repository.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the whole history, not just the last commit
          persist-credentials: false

      - name: Project rules (private keys, CTF flags, private files)
        run: |
          bash .githooks/check-secrets.sh --all
          bash .githooks/check-secrets.sh --history

      - name: gitleaks (whole history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Refuse to run a binary whose SHA-256 doesn't match the published checksum
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" checksums.txt | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --redact --verbose --no-banner
